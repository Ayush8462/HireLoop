services:
  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: hireloop-gateway
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - CLIENT_URL=http://localhost:5173
      - AUTH_SERVICE_URL=http://auth-service:5001
      - CORE_SERVICE_URL=http://core-service:5002
      - ATS_SERVICE_URL=http://ats-service:5003
      - NOTIFICATION_SERVICE_URL=http://notification-service:5004
      - CHATBOT_SERVICE_URL=http://chatbot-service:5005
    depends_on:
      - auth-service
      - core-service
      - ats-service
      - notification-service
      - chatbot-service
    networks:
      - hireloop-network

  auth-service:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile
    container_name: hireloop-auth-service
    restart: unless-stopped
    ports:
      - "5001:5001"
    env_file:
      - ./services/auth-service/.env
    networks:
      - hireloop-network

  core-service:
    build:
      context: ./services/core-service
      dockerfile: Dockerfile
    container_name: hireloop-core-service
    restart: unless-stopped
    ports:
      - "5002:5002"
    env_file:
      - ./services/core-service/.env
    environment:
      - ATS_SERVICE_URL=http://ats-service:5003
      - NOTIFICATION_SERVICE_URL=http://notification-service:5004
      - NOTIFICATION_INTERNAL_SECRET=hireloop_internal_secret_2024
    networks:
      - hireloop-network

  ats-service:
    build:
      context: ./services/ats-service
      dockerfile: Dockerfile
    container_name: hireloop-ats-service
    restart: unless-stopped
    ports:
      - "5003:5003"
    env_file:
      - ./services/ats-service/.env
    environment:
      - PORT=5003
      - NODE_ENV=production
    networks:
      - hireloop-network

  notification-service:
    build:
      context: ./services/notification-service
      dockerfile: Dockerfile
    container_name: hireloop-notification-service
    restart: unless-stopped
    ports:
      - "5004:5004"
    env_file:
      - ./services/notification-service/.env
    environment:
      - AUTH_SERVICE_URL=http://auth-service:5001
      - NOTIFICATION_INTERNAL_SECRET=hireloop_internal_secret_2024
    depends_on:
      - auth-service
  chatbot-service:
    build:
      context: ./services/chatbot-service
      dockerfile: Dockerfile
    container_name: hireloop-chatbot-service
    restart: unless-stopped
    ports:
      - "5005:5005"
    env_file:
      - ./services/chatbot-service/.env
    environment:
      - PORT=5005
      - ENVIRONMENT=production
    networks:
      - hireloop-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hireloop-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - gateway
    networks:
      - hireloop-network

networks:
  hireloop-network:
    driver: bridge
